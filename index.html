      gap: 14px;

      border-radius: 999px;
      box-shadow: 0 0 20px rgba(51, 204, 51, 0.35);
      z-index: 50;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #33cc33;
      text-shadow: 0 0 4px #33cc33;
      backdrop-filter: blur(2px);
    }
    .hud-name {
      font-weight: bold;
      letter-spacing: 1px;
    }
    .hud-sep {
      opacity: 0.4;
    }
    .hud a {
      color: #33cc33;
      text-decoration: none;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .hud a:hover,
    .hud a:focus-visible {
      background: #33cc33;
      color: #001100;
      text-shadow: none;
      outline: none;
    }
    .hud a.primary {
      border-color: #33cc33;
      animation: hudPulse 2.4s ease-in-out infinite;
    }
    @keyframes hudPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(51, 204, 51, 0.4); }
      50% { box-shadow: 0 0 14px rgba(51, 204, 51, 0.6); }
    }

    .monitor {
      width: 90vw;
      max-width: 1000px;
      height: 82vh;
      background: linear-gradient(145deg, #d4c8a8 0%, #c4b89a 30%, #bfb088 50%, #b8a87c 100%);
      border-radius: 25px 25px 30px 30px;
      padding: 50px 45px 55px 45px;
      box-shadow:
        0 0 80px rgba(0, 0, 0, 0.5),
        inset 0 2px 5px rgba(255, 255, 255, 0.2),
        inset 0 -5px 20px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .monitor::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border-radius: 20px;
      background:
        radial-gradient(circle at 20% 30%, rgba(220, 200, 120, 0.4) 0%, transparent 10%),
        radial-gradient(circle at 80% 70%, rgba(200, 180, 100, 0.3) 0%, transparent 8%),
        radial-gradient(circle at 50% 90%, rgba(190, 170, 90, 0.3) 0%, transparent 12%);
      pointer-events: none;
    }

    .monitor::after {
      content: '';
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      bottom: 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }

    .monitor-logo {
      position: absolute;
      top: 20px;
      right: 60px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 24px;
      color: #8a7a5a;
      text-shadow:
        1px 1px 0 rgba(255, 255, 255, 0.3),
        -1px -1px 0 rgba(0, 0, 0, 0.3);
      letter-spacing: 2px;
    }

    .monitor-buttons {
      position: absolute;
      bottom: 25px;
      right: 60px;
      display: flex;
      gap: 12px;
    }

    .monitor-button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(145deg, #a09070 0%, #7a6a50 100%);
      box-shadow:
        inset 0 -2px 4px rgba(0, 0, 0, 0.4),
        inset 0 2px 2px rgba(255, 255, 255, 0.2),
        0 2px 4px rgba(0, 0, 0, 0.3);
      border: 1px solid #5a4a3a;
      position: relative;
    }

    .monitor-button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6), transparent);
    }

    .monitor-button.power::after {
      background: radial-gradient(circle at 30% 30%, #4ade80, #22c55e);
      box-shadow: 0 0 6px #4ade80;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #001100 0%, #000800 50%, #000000 100%);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      border: 3px solid #000;
      box-shadow:
        inset 0 0 80px rgba(0, 20, 0, 0.8),
        inset 0 0 40px rgba(51, 204, 51, 0.2),
        0 0 20px rgba(0, 0, 0, 0.9);
    }

    .screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(0, 0, 0, 0.3) 51%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
      animation: scanlines 8s linear infinite;
    }

    .screen::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 60%, rgba(0, 0, 0, 0.9) 100%);
      pointer-events: none;
      z-index: 1;
      border-radius: 12px;
    }

    @keyframes scanlines {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }

    .content {
      position: relative;
      z-index: 3;
      color: #33cc33;
      text-shadow: 0 0 5px #33cc33, 0 0 10px #33cc33;
      animation: flicker 0.15s infinite alternate;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.98; }
      50% { opacity: 1; }
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding-bottom: 8px;
      border-bottom: 1px solid #33cc33;
      margin-bottom: 10px;
    }

    .terminal-output {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-bottom: 10px;
    }

    .terminal-output::-webkit-scrollbar {
      width: 8px;
    }

    .terminal-output::-webkit-scrollbar-track {
      background: #000;
    }

    .terminal-output::-webkit-scrollbar-thumb {
      background: #33cc33;
    }

    .terminal-output a {
      color: #7dd35f;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-shadow: 0 0 6px #7dd35f;
      cursor: pointer;
      position: relative;
      z-index: 4;
    }
    .terminal-output a:hover {
      background: #33cc33;
      color: #001100;
      text-shadow: none;
    }
    .terminal-output .accent {
      color: #fff66b;
      text-shadow: 0 0 6px #fff66b;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #33cc33;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .line {
      margin: 2px 0;
    }

    /* Hidden input that captures typing (summons the keyboard on mobile). */
    .kbd-input {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: 0;
      padding: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      pointer-events: none;
    }

    /* ── Bottom hint ── */
    .ground-hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      color: #33cc33;
      opacity: 0.55;
      text-shadow: 0 0 4px #33cc33;
      z-index: 50;
      pointer-events: none;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ground-sep { opacity: 0.5; }
    .ground-credit { color: #fff66b; text-shadow: 0 0 6px rgba(255, 246, 107, 0.5); }

    /* Calm everything down for users who ask for less motion. */
    @media (prefers-reduced-motion: reduce) {
      .screen::before { animation: none; }
      .content { animation: none; }
      .hud a.primary { animation: none; }
      .cursor { animation: none; }
    }

    @media (max-width: 720px) {
      .hud { font-size: 11px; gap: 8px; padding: 6px 10px; }
      .hud .hud-sep { display: none; }
      .monitor { padding: 30px 20px 35px 20px; height: 78vh; }
      .monitor-logo { font-size: 16px; right: 30px; top: 12px; }
      .monitor-buttons { right: 30px; bottom: 12px; gap: 8px; }
      .monitor-button { width: 18px; height: 18px; }
      .terminal-output { font-size: 12px; }
      .status-bar { font-size: 9px; }
      .ground-hint { font-size: 9px; }
    }
  </style>

      { text: 'Microsoft Windows [Version 10.0.26200]', delay: 80 },
      { text: '(c) Wes Hardcastle. Code is mine, opinions are mine, bugs are also mine.', delay: 60 },
      { text: '', delay: 250 },
      ...section('whoami', SECTIONS.whoami, 600),
      ...section('cat skills.txt', SECTIONS.skills, 700),
      ...section('ls ./projects --highlights', SECTIONS.projects, 700),
      ...section('cat services.txt', SECTIONS.services, 900),
      ...section('cat ./now/nwhoaportal.txt', SECTIONS.nwhoa, 900),
      ...section('open /blog', SECTIONS.blog, 900),
      ...section('contact --short', SECTIONS.contact, 800)
    ];

    let cmdIndex = 0;
    let charIndex = 0;
    let introTimer = null;
    let interactive = false;

    // Auto-scroll only when the user is already pinned to the bottom.
    // If they scroll up, we leave them alone so they can read or click links;
    // if they scroll back down to within ~12px of the bottom, auto-scroll resumes.
    let stickToBottom = true;
    const SCROLL_EPSILON = 12;

    function isAtBottom() {
      return output.scrollHeight - output.clientHeight - output.scrollTop <= SCROLL_EPSILON;
    }

    function maybeScrollToBottom() {
      if (stickToBottom) {
        output.scrollTop = output.scrollHeight;
      }
    }

    output.addEventListener('scroll', () => {
      stickToBottom = isAtBottom();
    }, { passive: true });

    // Wheel / touch up should immediately disengage auto-scroll.
    output.addEventListener('wheel', (e) => {
      if (e.deltaY < 0) stickToBottom = false;
    }, { passive: true });

    function makeLine(html) {
      const line = document.createElement('div');
      line.className = 'line';
      if (html !== undefined) line.innerHTML = html;
      return line;
    }

    function appendBlockHTML(html) {
      output.appendChild(makeLine(html));
      maybeScrollToBottom();
    }

    function appendBlockText(text) {
      const line = makeLine();
      line.textContent = text;
      output.appendChild(line);
      maybeScrollToBottom();
    }

    function appendSectionLine(l) {
      if (l.html !== undefined) appendBlockHTML(l.html);
      else appendBlockText(l.text);
    }

    function ensureTypingTarget() {
      // The most recent line is where typed characters land.
      // If there is no last line, create one.
      let last = output.lastElementChild;
      if (!last) {
        last = makeLine();
        output.appendChild(last);
      }
      return last;
    }

    function typeCommand() {
      if (cmdIndex >= commands.length) {
        startInteractive();
        return;
      }

      const cmd = commands[cmdIndex];

      if (cmd.typed) {
        const target = ensureTypingTarget();
        if (charIndex < cmd.text.length) {
          target.append(cmd.text[charIndex]);
          charIndex++;
          maybeScrollToBottom();
          introTimer = setTimeout(typeCommand, 55 + Math.random() * 90);
        } else {
          // Finished typing this command — start a fresh line for the next output.
          output.appendChild(makeLine());
          charIndex = 0;
          cmdIndex++;
          introTimer = setTimeout(typeCommand, cmd.delay || 100);
        }
        return;
      }

      // noBreak prompts get inlined into a fresh line that the next typed command will append to.
      if (cmd.noBreak) {
        appendBlockHTML(cmd.html || cmd.text);
        cmdIndex++;
        introTimer = setTimeout(typeCommand, cmd.delay || 50);
        return;
      }

      if (cmd.html !== undefined) {
        appendBlockHTML(cmd.html);
      } else {
        appendBlockText(cmd.text);
      }
      cmdIndex++;
      introTimer = setTimeout(typeCommand, cmd.delay || 50);
    }

    // ── Skip / fast-forward ──────────────────────────────────────────
    function skipIntro() {
      if (interactive) return;
      clearTimeout(introTimer);

      while (cmdIndex < commands.length) {
        const cmd = commands[cmdIndex];
        if (cmd.typed) {
          const target = ensureTypingTarget();
          target.append(cmd.text.slice(charIndex));
          charIndex = 0;
          output.appendChild(makeLine());
        } else if (cmd.noBreak) {
          output.appendChild(makeLine(cmd.html || cmd.text));
        } else if (cmd.html !== undefined) {
          output.appendChild(makeLine(cmd.html));
        } else {
          const line = makeLine();
          line.textContent = cmd.text;
          output.appendChild(line);
        }
        cmdIndex++;
      }
      stickToBottom = true;
      output.scrollTop = output.scrollHeight;
      startInteractive();
    }

    // ── Interactive prompt ───────────────────────────────────────────
    let typedSpan = null;
    let inputLine = null;

    function newInputLine() {
      inputLine = makeLine();
      const promptSpan = document.createElement('span');
      promptSpan.className = 'prompt-text';
      promptSpan.innerHTML = PROMPT;
      typedSpan = document.createElement('span');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      cursor.setAttribute('aria-hidden', 'true');
      inputLine.appendChild(promptSpan);
      inputLine.appendChild(typedSpan);
      inputLine.appendChild(cursor);
      output.appendChild(inputLine);
      stickToBottom = true;
      output.scrollTop = output.scrollHeight;
    }

    function startInteractive() {
      if (interactive) return;
      interactive = true;
      newInputLine();
      hintEl.textContent = "tip: type 'help' + Enter — or click any underlined link";
      kbd.value = '';
      // Programmatic focus won't summon the mobile keyboard (that needs a
      // tap on the screen), so this is desktop-only in practice.
      kbd.focus({ preventScroll: true });
    }

    function renderInput() {
      if (typedSpan) typedSpan.textContent = kbd.value;
      maybeScrollToBottom();
    }

    const EGGS = {
      'sudo': ["Access granted. Just kidding — nice try though.", "Escalation attempts are logged and framed on my wall."],
      'format c:': ['Access is denied.', "(You'd be amazed how often that works on real engagements, though.)"],
      'rm -rf /': ['Nice try. This terminal is read-mostly.', "If you want to break things professionally, see 'services'."],
      'hack': ["I only do that with a signed SOW. See 'services'.", 'Rules of engagement exist for a reason.'],
      'exit': ["There is no escape. Try 'blog' instead."],
      'quit': ["There is no escape. Try 'blog' instead."]
    };

    function resolveCommand(raw) {
      const c = raw.trim().toLowerCase();
      if (c === '') return [];
      if (c === 'help' || c === '?') return SECTIONS.help;
      if (c === 'whoami' || c === 'who') return SECTIONS.whoami;
      if (c === 'skills' || c === 'cat skills.txt' || c === 'skills.txt') return SECTIONS.skills;
      if (c === 'projects' || c === 'ls' || c === 'dir' || c.startsWith('ls ')) return SECTIONS.projects;
      if (c === 'services' || c === 'hire' || c === 'cat services.txt') return SECTIONS.services;
      if (c === 'nwhoa' || c === 'nwhoaportal' || c === 'hoa') return SECTIONS.nwhoa;
      if (c === 'blog' || c === 'open /blog' || c === 'writing') return SECTIONS.blog;
      if (c === 'contact' || c === 'email' || c === 'contact --short') return SECTIONS.contact;
      if (c === 'clear' || c === 'cls') return 'CLEAR';
      for (const key of Object.keys(EGGS)) {
        if (c === key || c.startsWith(key + ' ')) {
          return EGGS[key].map(t => ({ text: t }));
        }
      }
      if (c.startsWith('cat ')) {
        return [{ text: "The system cannot find the file specified. Try 'skills', 'services', or 'help'." }];
      }
      return [
        { text: `'${raw.trim()}' is not recognized as an internal or external command.` },
        { html: "type <span class=\"accent\">help</span> to see what this terminal understands." }
      ];
    }

    function runCommand(raw) {
      // Freeze the current input line as a plain echo of what was typed.
      inputLine.innerHTML = '<span class="prompt-text">' + PROMPT + '</span>';
      inputLine.appendChild(document.createTextNode(raw));
      typedSpan = null;

      const result = resolveCommand(raw);
      if (result === 'CLEAR') {
        output.innerHTML = '';
      } else if (result.length) {
        output.appendChild(makeLine());
        result.forEach(appendSectionLine);
        output.appendChild(makeLine());
      }
      newInputLine();
      renderInput();
    }

    // ── Input wiring ─────────────────────────────────────────────────
    kbd.addEventListener('input', renderInput);

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (!interactive) {
        // Any reasonable key skips the intro. preventDefault so the
        // skip keystroke doesn't leak into the freshly-focused input.
        if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ' || e.key.length === 1) {
          e.preventDefault();
          skipIntro();
        }
        return;
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        const raw = kbd.value;
        kbd.value = '';
        runCommand(raw);
        return;
      }

      // Keystrokes that land outside the hidden input (user never clicked):
      // mirror them into the buffer, then capture focus for the rest.
      if (e.target !== kbd) {
        if (e.key === 'Backspace') {
          kbd.value = kbd.value.slice(0, -1);
          renderInput();
        } else if (e.key.length === 1) {
          kbd.value += e.key;
          renderInput();
        }
        kbd.focus({ preventScroll: true });
      }
    });

    document.querySelector('.screen').addEventListener('click', (e) => {
      if (e.target.closest('a')) return; // let links be links
      if (!interactive) {
        skipIntro();
      } else {
        // A real user tap — this one CAN summon the mobile keyboard.
        kbd.focus({ preventScroll: true });
      }
    });

    // ── Boot ─────────────────────────────────────────────────────────
    if (REDUCED_MOTION) {
      skipIntro();
    } else {
      introTimer = setTimeout(typeCommand, 400);
    }
  </script>
</body>
</html>
